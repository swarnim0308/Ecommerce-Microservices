spring.application.name=Inventory-Service

server.port=9003

spring.h2.console.enabled=true
spring.datasource.url=jdbc:postgresql://postgres-db:5432/ecommerce
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
spring.jpa.hibernate.ddl-auto=update

# Actuator health + Kubernetes-style liveness/readiness probes
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Distributed tracing (Micrometer + Zipkin)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# RabbitMQ - order-placed event consumption (stock decrement)
app.rabbitmq.queue=inventory.order.placed
