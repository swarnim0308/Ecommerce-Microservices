x-service-env: &service-env
  SPRING_CLOUD_CONFIG_URI: http://config-server:8888
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ecommerce
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: password
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: guest
  SPRING_RABBITMQ_PASSWORD: guest
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"

services:
  # --- Databases ---
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  # --- Infrastructure ---
  service-registry:
    build: ./service-registery
    container_name: service-registry
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      EUREKA_CLIENT_REGISTERWITHEUREKA: "false"
      EUREKA_CLIENT_FETCHREGISTRY: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    networks:
      - ecommerce-network

  config-server:
    build: ./Config-Server
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      - service-registry
    environment:
      SPRING_PROFILES_ACTIVE: native
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
    volumes:
      - ./config-properties:/config/config-properties
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - ecommerce-network

  zuul-api-gateway:
    build: ./zuul-api-gateway
    container_name: zuul-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
    networks:
      - ecommerce-network

  # --- Microservices ---
  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped
    ports:
      - "9002:9002"
    depends_on:
      - service-registry
      - config-server
      - postgres-db
    environment:
      <<: *service-env
    networks:
      - ecommerce-network

  order-service:
    build: ./OrderService
    container_name: order-service
    restart: unless-stopped
    ports:
      - "9005:9005"
    depends_on:
      - service-registry
      - config-server
      - postgres-db
    environment:
      <<: *service-env
    networks:
      - ecommerce-network

  inventory-service:
    build: ./Inventory-Service
    container_name: inventory-service
    restart: unless-stopped
    ports:
      - "9003:9003"
    depends_on:
      - service-registry
      - config-server
      - postgres-db
    environment:
      <<: *service-env
    networks:
      - ecommerce-network

  cart-service:
    build: ./Cart-Entity
    container_name: cart-service
    restart: unless-stopped
    ports:
      - "9004:9004"
    depends_on:
      - service-registry
      - config-server
      - postgres-db
    environment:
      <<: *service-env
    networks:
      - ecommerce-network

  customer-service:
    build: ./CustomerService
    container_name: customer-service
    restart: unless-stopped
    ports:
      - "9001:9001"
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_healthy
      postgres-db:
        condition: service_started
    environment:
      <<: *service-env
    networks:
      - ecommerce-network

  shipping-service:
    build: ./shipping-service
    container_name: shipping-service
    restart: unless-stopped
    ports:
      - "9006:9006"
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_healthy
      postgres-db:
        condition: service_started
    environment:
      <<: *service-env
    networks:
      - ecommerce-network

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres-data:
