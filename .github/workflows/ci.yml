name: CI

on:
  push:
    branches: [master, feature/frontend-service-integration]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Build & test (Maven)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - service-registery
          - Config-Server
          - zuul-api-gateway
          - product-service
          - Inventory-Service
          - OrderService
          - Cart-Entity
          - CustomerService
          - shipping-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build module
        run: mvn -B -f ${{ matrix.module }}/pom.xml package
      - name: Test module
        run: mvn -B -f ${{ matrix.module }}/pom.xml test

  frontend:
    name: Build & lint (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
